<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Side-by-side JSON Resume Editor & Live Preview"
    />
    <title>JSON Resume — Live Editor</title>
    <link rel="stylesheet" href="src/styles.css" />
    <link rel="stylesheet" href="src/previewer.css" />
    <link rel="stylesheet" href="src/editor.css" />
    <script type="importmap">
      {
        "imports": {
          "fs": "/fs-polyfill.js",
          "node:fs": "/fs-polyfill.js"
        }
      }
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-left">
        <a class="brand" href="./">PB<span> / CV Editor</span></a>
        <div class="preset-picker" role="group" aria-label="Preset resumes">
          <span class="toolbar-label">Preset:</span>
          <button data-cv="example" aria-pressed="true">Preset</button>
        </div>
        <div class="theme-picker-group">
          <label for="theme-select" class="toolbar-label">Theme:</label>
          <select id="theme-select" class="theme-select">
            <option value="" selected>(No theme loaded)</option>
          </select>
        </div>
      </div>

      <div class="header-right">
        <!-- Load URL dialog/input -->
        <button id="btn-load-url" title="Load JSON from URL">Load URL</button>
        <!-- Upload file button -->
        <label class="btn-file-upload" title="Upload local JSON file">
          Upload JSON
          <input
            type="file"
            id="file-upload"
            accept=".json,application/json"
            hidden
          />
        </label>
        <!-- Compile / Render button -->
        <button
          id="btn-compile"
          class="primary-button"
          title="Recompile preview (Ctrl+Enter / Cmd+Enter)"
        >
          <i class="fa fa-refresh"></i> Recompile
        </button>
        <button
          class="print-button"
          type="button"
          onclick="window.print()"
          title="Print or save as PDF"
        >
          <i class="fa fa-print"></i> Print / PDF
        </button>
      </div>
    </header>

    <div class="workspace">
      <!-- Left side: Editor Panel -->
      <section class="editor-pane" aria-label="JSON Source Editor">
        <div class="pane-header">
          <span class="pane-title"><i class="fa fa-code"></i> resume.json</span>
          <div class="editor-status" id="editor-status">Ready</div>
        </div>
        <textarea
          id="json-editor"
          spellcheck="false"
          placeholder="Paste or edit your JSON resume here..."
        ></textarea>
      </section>

      <!-- Right side: Preview Panel -->
      <section class="preview-pane" aria-label="Rendered Preview">
        <div class="pane-header">
          <span class="pane-title"><i class="fa fa-eye"></i> Preview</span>
          <button id="btn-popout" type="button" title="Open preview in new tab">
            Open in new tab
          </button>
        </div>
        <div class="preview-scroll">
          <div id="app" aria-live="polite">
            <template shadowrootmode="open">
              <p class="loading">Loading CV…</p>
            </template>
          </div>
        </div>
      </section>
    </div>

    <noscript>This CV editor needs JavaScript enabled to display.</noscript>
    <script type="module" src="src/previewer.js"></script>
    <script type="module" src="src/editor.js"></script>
    <script>
      if (window.location.hash == "#detached") {
        document.querySelector(".editor-pane").remove();
      } else {
        //import('./src/editor.js');
        function popOut() {
          window.open("#detached");
          window.location.hash = "#detacher";
          document.querySelector(".preview-pane").remove();
        }

        const btnPopOut = document.querySelector("#btn-popout");
        btnPopOut.addEventListener("click", popOut);
      }
    </script>
  </body>
</html>
